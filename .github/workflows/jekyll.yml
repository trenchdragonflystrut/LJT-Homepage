name: Build and Deploy Jekyll
on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages (enable Pages with GitHub Actions source first)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - uses: ruby/setup-ruby@v1.328.0
        with: {ruby-version: '3.1', bundler-cache: true, cache-version: 0}
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        if: inputs.deploy
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env: {JEKYLL_ENV: production}
      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5.0.0
        with: {path: _site}
      - name: Upload built site artifact
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v4
        with: {name: jekyll-site, path: _site}
  deploy:
    needs: build
    if: inputs.deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
